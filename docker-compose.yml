# docker compose up --build  ->  http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fc27
      POSTGRES_PASSWORD: fc27_dev_password
      POSTGRES_DB: fc27
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fc27"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://fc27:fc27_dev_password@db:5432/fc27
      AUTO_MIGRATE: "true"
      SEED_DEMO_USER: "true"
      MARKET_DATA_PROVIDER: none
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
